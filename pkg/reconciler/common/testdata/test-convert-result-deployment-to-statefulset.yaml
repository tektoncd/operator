apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-results-watcher
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: tekton-results-watcher
    app.kubernetes.io/part-of: tekton-results
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tekton-results-watcher
  template:
    metadata:
      labels:
        app: tekton-results-watcher
        app.kubernetes.io/name: tekton-results-watcher
    spec:
      serviceAccountName: tekton-results-watcher
      containers:
      - name: watcher
        image: ghcr.io/tektoncd/results/watcher:latest
        env:
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_LOGGING_NAME
          value: tekton-results-config-logging
        - name: CONFIG_LEADERELECTION_NAME
          value: tekton-results-config-leader-election
        - name: CONFIG_OBSERVABILITY_NAME
          value: tekton-results-config-observability
        - name: METRICS_DOMAIN
          value: tekton.dev/results
        ports:
        - name: metrics
          containerPort: 9090
        - name: profiling
          containerPort: 8008
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: tekton-results-watcher
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: tekton-results-watcher
    app.kubernetes.io/part-of: tekton-results
spec:
  ports:
  - name: metrics
    port: 9090
  - name: profiling
    port: 8008
  selector:
    app.kubernetes.io/name: tekton-results-watcher
