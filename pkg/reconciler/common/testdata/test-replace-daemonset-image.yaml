apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: tekton-node-agent
spec:
  selector:
    matchLabels:
      run: test
  template:
    metadata:
      labels:
        run: test
    spec:
      containers:
        - image: busybox
          name: controller-deployment
          args: [
            "-bash-image", "busybox",
            "-nop=nop"
          ]
        - image: busybox
          name: sidecar
          args: [
            "-git", "git"
          ]
