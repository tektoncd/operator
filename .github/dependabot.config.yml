# Dependabot configuration
# This file defines the base configuration and branches for dependabot updates.
# The actual .github/dependabot.yml is generated from this file.
#
# Automated regeneration:
# - A GitHub Actions workflow runs weekly to regenerate dependabot.yml
# - If changes are detected, it automatically creates a PR
# - See: .github/workflows/dependabot-regen.yml
#
# Manual regeneration:
# 1. Edit the 'ecosystems' section to change what packages to monitor
# 2. Edit the 'release-branches' section to add/remove branches
# 3. Run: ./hack/generate-dependabot.sh

# List of release branches to monitor (in addition to main branch)
# These should be active LTS release branches
# Check releases.md for the current list of supported releases
release-branches:
  - release-v0.81.x
  - release-v0.80.x
  - release-v0.79.x
  - release-v0.78.x
  - release-v0.77.x
# Package ecosystems to monitor
# Each ecosystem will be configured for:
# - main branch: all updates (major, minor, patch)
# - release branches: patch updates only
ecosystems:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    labels:
      - ok-to-test
      - dependencies
      - release-note-none
      - kind/misc
    ignore:
      - dependency-name: "k8s.io/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "go.opentelemetry.io/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Pseudo-version only; Dependabot cannot resolve a semver bump for it.
      - dependency-name: "github.com/openshift/client-go"
    groups:
      kubernetes:
        patterns:
          - k8s.io/*
      opentelemetry:
        patterns:
          - go.opentelemetry.io/*
          - go.opentelemetry.io/contrib/*
          - knative.dev/pkg
      sigstore:
        patterns:
          - github.com/sigstore/sigstore
          - github.com/sigstore/sigstore/*
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ok-to-test
      - dependencies
      - release-note-none
      - kind/misc
    groups:
      # Collapse all GitHub Actions bumps into a single weekly PR per branch.
      # These are low-risk version bumps and were previously opened one PR per
      # action, flooding the queue (especially on release branches).
      # Also keeps github/codeql-action/* sub-actions on the same version (the
      # CodeQL bundle refuses to run when init and analyze diverge).
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # Keeps the pinned ko/koparse image digests in tekton/build-publish-images-manifests.yaml
  # in sync so they don't silently drift behind the Go toolchain version required by go.mod
  # (see https://github.com/tektoncd/chains/pull/1784 for the class of failure this prevents:
  # "go.mod requires go >= X (running go Y; GOTOOLCHAIN=local)" during release builds).
  - package-ecosystem: docker
    directory: /tekton
    schedule:
      interval: weekly
    labels:
      - ok-to-test
      - dependencies
      - release-note-none
      - kind/misc
    groups:
      all:
        patterns:
          - "*"
    cooldown:
      default-days: 7
