{{- if .Values.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tekton-operator.fullname" . }}-info
  labels:
    {{- include "tekton-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resourceNames:
      - tekton-operator-info
    resources:
      - configmaps
    verbs:
      - get
      - describe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: default
  name: {{ include "tekton-operator.fullname" . }}-info
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tekton-operator.fullname" . }}-info
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tekton-operator.fullname" . }}-config-read-role
  labels:
    {{- include "tekton-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - operator.tekton.dev
    resources:
      - tektonconfigs
    verbs:
      - get
      - watch
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tekton-operator.fullname" . }}-config-read-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tekton-operator.fullname" . }}-config-read-role
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tekton-operator.fullname" . }}-scheduler-role
  labels:
    {{- include "tekton-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - resourceflavors
      - workloads
      - workloads/finalizers
      - workloads/status
      - workloadpriorityclasses
      - multikueueclusters
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - issuers
    verbs:
      - get
      - create
      - update
      - list
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tekton-operator.fullname" . }}-scheduler-rolebinding
  labels:
    {{- include "tekton-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tekton-operator.fullname" . }}-scheduler-role
subjects:
  - kind: ServiceAccount
    name: {{ include "tekton-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tekton-operator.fullname" . }}-result-read-role
  labels:
    {{- include "tekton-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - operator.tekton.dev
    resources:
      - tektonresults
    verbs:
      - get
      - watch
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tekton-operator.fullname" . }}-result-read-rolebinding
  labels:
    {{- include "tekton-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tekton-operator.fullname" . }}-result-read-role
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
{{- end -}}
