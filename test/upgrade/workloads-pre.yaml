# Workloads created before operator upgrade (scenario B).
apiVersion: v1
kind: Namespace
metadata:
  name: operator-upgrade-test
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upgrade-echo
  namespace: operator-upgrade-test
spec:
  steps:
  - name: echo
    image: busybox:stable
    command: ["echo"]
    args: ["upgrade-test workload"]
---
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: upgrade-echo-pre
  namespace: operator-upgrade-test
spec:
  taskRef:
    name: upgrade-echo
